name: Google Cloud Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build:
    name: Build and deploy (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: current
            workload_identity_provider_secret: GCP_WORKLOAD_IDENTITY_PROVIDER
            service_account_secret: GCP_SERVICE_ACCOUNT
            project: ${{ vars.GCP_PROJECT_ID }}
            region: ${{ vars.GCP_REGION }}
            repository: ${{ vars.GCP_ARTIFACT_REGISTRY_REPOSITORY }}
            image: ${{ vars.GCP_IMAGE_NAME }}
            job: ${{ vars.CLOUD_RUN_JOB }}
            job_region: ${{ vars.CLOUD_RUN_JOB_REGION || vars.GCP_REGION }}
          - name: lbrform-sodexo
            workload_identity_provider_secret: LBRFORM_SODEXO_GCP_WORKLOAD_IDENTITY_PROVIDER
            service_account_secret: LBRFORM_SODEXO_GCP_SERVICE_ACCOUNT
            project: lbrform-sodexo
            region: europe-west8
            repository: app-images
            image: sodexo-lms-converter
            job: sodexo-docx-worker
            job_region: europe-west8

    env:
      PROJECT_ID: ${{ matrix.project }}
      REGION: ${{ matrix.region }}
      REPOSITORY: ${{ matrix.repository }}
      IMAGE_NAME: ${{ matrix.image }}
      CLOUD_RUN_JOB: ${{ matrix.job }}
      CLOUD_RUN_JOB_REGION: ${{ matrix.job_region }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets[matrix.workload_identity_provider_secret] }}
          service_account: ${{ secrets[matrix.service_account_secret] }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Build image with Cloud Build
        id: build
        shell: bash
        run: |
          set -euo pipefail

          IMAGE_TAG="${GITHUB_SHA::12}"
          IMAGE_URI="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${IMAGE_NAME}:${IMAGE_TAG}"

          BUILD_ID="$(gcloud builds submit \
            --project "${PROJECT_ID}" \
            --async \
            --format='value(id)' \
            --tag "${IMAGE_URI}" \
            .)"

          if [ -z "${BUILD_ID}" ]; then
            echo "Unable to determine Cloud Build ID." >&2
            exit 1
          fi

          gcloud builds describe "${BUILD_ID}" \
            --project "${PROJECT_ID}" \
            --format='value(status)' >/dev/null

          while true; do
            BUILD_STATUS="$(gcloud builds describe "${BUILD_ID}" \
              --project "${PROJECT_ID}" \
              --format='value(status)')"

            case "${BUILD_STATUS}" in
              SUCCESS)
                break
                ;;
              FAILURE|INTERNAL_ERROR|TIMEOUT|CANCELLED|EXPIRED)
                echo "Cloud Build failed with status: ${BUILD_STATUS}" >&2
                gcloud builds describe "${BUILD_ID}" \
                  --project "${PROJECT_ID}" \
                  --format='yaml(id,status,logUrl,results.images,substitutions)'
                exit 1
                ;;
            esac

            sleep 5
          done

          echo "image_uri=${IMAGE_URI}" >> "${GITHUB_OUTPUT}"
          echo "build_id=${BUILD_ID}" >> "${GITHUB_OUTPUT}"

      - name: Update Cloud Run Job
        if: ${{ env.CLOUD_RUN_JOB != '' }}
        shell: bash
        run: |
          set -euo pipefail

          gcloud run jobs update "${CLOUD_RUN_JOB}" \
            --project "${PROJECT_ID}" \
            --image "${{ steps.build.outputs.image_uri }}" \
            --region "${CLOUD_RUN_JOB_REGION}"
