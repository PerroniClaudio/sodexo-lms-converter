name: Google Cloud Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: ${{ vars.GCP_REGION }}
  REPOSITORY: ${{ vars.GCP_ARTIFACT_REGISTRY_REPOSITORY }}
  IMAGE_NAME: ${{ vars.GCP_IMAGE_NAME }}
  CLOUD_RUN_JOB: ${{ vars.CLOUD_RUN_JOB }}
  CLOUD_RUN_JOB_REGION: ${{ vars.CLOUD_RUN_JOB_REGION || vars.GCP_REGION }}

jobs:
  build:
    name: Build and publish image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Build image with Cloud Build
        id: build
        shell: bash
        run: |
          set -euo pipefail

          IMAGE_TAG="${GITHUB_SHA::12}"
          IMAGE_URI="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${IMAGE_NAME}:${IMAGE_TAG}"

          BUILD_ID="$(gcloud builds submit \
            --project "${PROJECT_ID}" \
            --async \
            --format='value(id)' \
            --tag "${IMAGE_URI}" \
            .)"

          if [ -z "${BUILD_ID}" ]; then
            echo "Unable to determine Cloud Build ID." >&2
            exit 1
          fi

          gcloud builds describe "${BUILD_ID}" \
            --project "${PROJECT_ID}" \
            --format='value(status)' >/dev/null

          while true; do
            BUILD_STATUS="$(gcloud builds describe "${BUILD_ID}" \
              --project "${PROJECT_ID}" \
              --format='value(status)')"

            case "${BUILD_STATUS}" in
              SUCCESS)
                break
                ;;
              FAILURE|INTERNAL_ERROR|TIMEOUT|CANCELLED|EXPIRED)
                echo "Cloud Build failed with status: ${BUILD_STATUS}" >&2
                gcloud builds describe "${BUILD_ID}" \
                  --project "${PROJECT_ID}" \
                  --format='yaml(id,status,logUrl,results.images,substitutions)'
                exit 1
                ;;
            esac

            sleep 5
          done

          echo "image_uri=${IMAGE_URI}" >> "${GITHUB_OUTPUT}"
          echo "build_id=${BUILD_ID}" >> "${GITHUB_OUTPUT}"

      - name: Update Cloud Run Job
        if: ${{ env.CLOUD_RUN_JOB != '' }}
        shell: bash
        run: |
          set -euo pipefail

          gcloud run jobs update "${CLOUD_RUN_JOB}" \
            --project "${PROJECT_ID}" \
            --image "${{ steps.build.outputs.image_uri }}" \
            --region "${CLOUD_RUN_JOB_REGION}"
